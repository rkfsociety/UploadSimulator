# CI: Godot, линтеры GDScript/Python, Semgrep, actionlint
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    name: Godot import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Godot 4.6.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: false

      - name: Import project (headless)
        run: godot --headless --path . --import --quit-after 1

  gdscript:
    name: GDScript lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: gdlint
        run: gdlint scripts/ tests/

      - name: gdformat check
        run: gdformat --check scripts/ tests/

  unit-tests:
    name: GDScript unit tests
    runs-on: ubuntu-latest
    needs: godot
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Godot 4.6.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: false

      - name: Run unit tests
        run: godot --headless --path . -s res://tests/test_runner.gd

  python-tools:
    name: Python (tools/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install ruff
      - run: ruff check tools/

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/ci

  actionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - name: actionlint
        run: ./actionlint -color

  android-apk:
    name: Android APK (debug)
    runs-on: ubuntu-latest
    needs: godot
    steps:
      - uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot 4.6.2 (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: false
          include-templates: true

      - name: Generate debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12

      - name: Point Godot to the Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK_ROOT\""
          } > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project (headless)
        run: godot --headless --path . --import --quit-after 1

      - name: Export Android APK (debug)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/UploadSimulator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UploadSimulator-apk
          path: build/UploadSimulator.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-apk-${{ github.run_number }}
          name: Android APK Build #${{ github.run_number }}
          body: |
            Автоматическая сборка APK для Android
            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
          files: build/UploadSimulator.apk
          draft: false
          prerelease: true
